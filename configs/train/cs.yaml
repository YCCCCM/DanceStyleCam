experiment:
  name: dsc_cs
  seed: 42

data:
  config: configs/data/dcm_style_pp.yaml
  split: train
  style_vocabulary: legacy_dsc_v1

model:
  stage: cs
  camera_format: polar
  style_vocabulary: legacy_dsc_v1
  history_len: 60
  inference_len: 60
  latent_dim: 512
  ff_size: 1024
  num_layers: 8
  num_heads: 8
  dropout: 0.1

training:
  output_root: runs
  resume_checkpoint: null
  use_gan: true
  epochs: 1200
  batch_size: 128
  num_workers: 8
  drop_last: true
  learning_rate: 0.0002
  weight_decay: 0.02
  ema_decay: 0.9999
  ema_interval: 1
  gradient_clip: 1.0
  save_every: 200
  max_steps_per_epoch: null

losses:
  reconstruction: 2.0
  velocity: 5.0
  acceleration: 5.0
  inside_body_attention: 0.0075
  outside_body_attention: 0.0

adversarial:
  discriminator_learning_rate: 0.00001
  late_discriminator_learning_rate: 0.000005
  learning_rate_change_epoch: 501
  gradient_penalty: 0.5
  late_gradient_penalty: 0.8
  schedule_after_epoch: 300
  generator_weight: 0.0005
  style_weight: 0.00002
  focus_weight: 0.0002
